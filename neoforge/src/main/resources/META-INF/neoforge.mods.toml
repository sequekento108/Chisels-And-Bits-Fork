modLoader = "javafml"
loaderVersion = "[4,)"
license = "$project.license"

[[mods]]
modId = "$project.mod.id"
version = "$version"
displayName = "Chisels and Bits"
authors = "$project.author"
logoFile = "logo-forge.png"
description = '''
$project.description
'''
updateJSONURL="https://curseupdate.com/$project.curse.id.neoforge/$project.mod.id?ml=neoforge"
[[dependencies.$project.mod.id]]
modId = "neoforge"
required = true
versionRange = "$dependencies.net.neoforged.neoforge.maven"
ordering = "AFTER"
side = "BOTH"
[[dependencies.$project.mod.id]]
modId = "minecraft"
required = true
versionRange = "${minecraft.range.neoforge.get()}"
ordering = "AFTER"
side = "BOTH"
[[dependencies.$project.mod.id]]
modId = "scena"
required = true
versionRange = "$dependencies.com.communi_suggestu.scena.neoforge.maven"
ordering = "AFTER"
side = "BOTH"
